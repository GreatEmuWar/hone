name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --require-hashes -r .github/requirements/build.txt
        poetry install --no-interaction
    - name: Lint
      run: poetry run ruff check hone tests pbt
    - name: Type check
      run: poetry run mypy
    - name: Test
      run: poetry run pytest

  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --require-hashes -r .github/requirements/build.txt
        poetry install --no-interaction
    - name: Check for benchmark regressions
      run: poetry run python -m hone.benchmarks --quick --jobs 4 --baseline benchmarks/quick-baseline.json

  # On main, once the checks pass: tag and release the version in pyproject.toml if it
  # hasn't been released yet, with its section of CHANGELOG.md as the notes.
  release:
    needs: [ test, benchmark ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # To create the release and its tag.
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Find the version
      id: version
      run: |
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
          echo "$version is already released"
          echo "new=false" >> "$GITHUB_OUTPUT"
        else
          echo "new=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      if: steps.version.outputs.new == 'true'
      with:
        python-version: "3.14"
    - name: Build
      if: steps.version.outputs.new == 'true'
      run: |
        python -m pip install --require-hashes -r .github/requirements/build.txt
        poetry build
    # Signs a record tying the packages to this workflow run, which `gh attestation verify` checks.
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      if: steps.version.outputs.new == 'true'
      with:
        subject-path: dist/*
    - name: Release
      if: steps.version.outputs.new == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        awk -v version="$VERSION" '
          /^## / { inside = ($2 == version); next }
          inside
        ' CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "CHANGELOG.md has no section for $VERSION"
          exit 1
        fi
        gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
    - name: Keep the packages for publishing
      if: steps.version.outputs.new == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/

  # Upload a newly released version's packages to PyPI. PyPI trusts this workflow, run in the
  # pypi environment, as the publisher of hone-python, so no token is stored.
  publish:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hone-python
    permissions:
      # For trusted publishing: PyPI accepts this run's identity token instead of a stored one.
      id-token: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
