name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly, so new queries run against code that hasn't changed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # To upload the results to the Security tab.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Python for the package, actions for these workflows. Neither needs a build.
        language: [ "python", "actions" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: "/language:${{ matrix.language }}"
