# OpenSSF Scorecard: scores the repository against a supply-chain checklist, such as pinned
# dependencies, branch protection and token permissions, and reports in the Security tab.
# The scorecard action allows only a few other actions in this workflow, so it stands alone.
name: Scorecard

on:
  push:
    branches: [ "main" ]
  # Rescored when branch protection changes, and weekly for the checks that look outside the code.
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # To upload the results to the Security tab.
      security-events: write
      # To publish the results to the OpenSSF, which the scorecard badge reads.
      id-token: write
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scorecard
        path: results.sarif
        retention-days: 5
    - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: results.sarif
