[project]
name = "hone"
version = "0.4.0"
description = "A python-based optimization engine/library."
authors = [{ name = "David Beare", email = "rnbeare@gmail.com" }]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy (>=1.26.2)",
    "pyyaml (>=6.0.1,<7.0.0)",
    "pydantic (>=2.7,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "--cov=hone --cov-report=term-missing"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Subpackage __init__ files re-export the public API.
"__init__.py" = ["F401"]
